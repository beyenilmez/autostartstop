name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!*.md'
      - '!LICENSE'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!*.md'
      - '!LICENSE'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a draft GitHub release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      bumped: ${{ steps.version.outputs.bumped }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          sparse-checkout: build.gradle.kts
          sparse-checkout-cone-mode: false

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact_name=AutoStartStop-$VERSION.jar" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

          # Check if a tag for this version already exists
          if git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
            echo "bumped=false" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists"
          else
            echo "bumped=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION does not exist — version was bumped"
          fi

  build:
    name: Build
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: plugin-jar-${{ github.run_id }}
          path: build/libs/${{ needs.version.outputs.artifact_name }}
          if-no-files-found: error

  github-release:
    name: GitHub Release
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.release) ||
      (github.event_name == 'push' && needs.version.outputs.bumped == 'true')
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8
        with:
          name: plugin-jar-${{ github.run_id }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: ${{ needs.version.outputs.artifact_name }}