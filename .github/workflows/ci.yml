name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!*.md'
      - '!LICENSE'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!*.md'
      - '!LICENSE'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a draft GitHub release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      bumped: ${{ steps.version.outputs.bumped }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: build.gradle.kts
          sparse-checkout-cone-mode: false

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact_name=AutoStartStop-$VERSION.jar" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

          # Check if a tag for this version already exists
          if git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
            echo "bumped=false" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists"
          else
            echo "bumped=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION does not exist — version was bumped"
          fi

  build:
    name: Build
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: plugin-jar-${{ github.run_id }}
          path: build/libs/${{ needs.version.outputs.artifact_name }}
          if-no-files-found: error

  github-release:
    name: GitHub Release
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.release) ||
      (github.event_name == 'push' && needs.version.outputs.bumped == 'true')
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: plugin-jar-${{ github.run_id }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: ${{ needs.version.outputs.artifact_name }}