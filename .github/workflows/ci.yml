name: CI

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!*.md'
      - '!LICENSE'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!*.md'
      - '!LICENSE'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a draft GitHub release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  version:
    name: Extract Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      bumped: ${{ steps.version.outputs.bumped }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          sparse-checkout: build.gradle.kts
          sparse-checkout-cone-mode: false

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep -oP 'version\s*=\s*"\K[^"]+' build.gradle.kts)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "artifact_name=AutoStartStop-$VERSION.jar" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

          # Check if a tag for this version already exists
          if git ls-remote --tags origin | grep -q "refs/tags/v${VERSION}$"; then
            echo "bumped=false" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION already exists"
          else
            echo "bumped=true" >> $GITHUB_OUTPUT
            echo "Tag v$VERSION does not exist — version was bumped"
          fi

  build:
    name: Build
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-jar-${{ github.run_id }}
          path: build/libs/${{ needs.version.outputs.artifact_name }}
          if-no-files-found: error

  github-release:
    name: GitHub Release
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.release) ||
      (github.event_name == 'push' && needs.version.outputs.bumped == 'true')
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: plugin-jar-${{ github.run_id }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: ${{ needs.version.outputs.artifact_name }}