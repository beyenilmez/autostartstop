# MkDocs configuration
docs_dir: src
strict: true  # Fail on warnings
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: relative_to_docs
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn

# Project information
site_name: AutoStartStop
site_url: https://beyenilmez.github.io/autostartstop/
site_author: Bedirhan Yenilmez
site_description: >-
  AutoStartStop is a Velocity plugin for automated server management that lets you define
  rule-based automation with triggers, conditions, and actions.

# Repository
repo_name: beyenilmez/autostartstop
repo_url: https://github.com/beyenilmez/autostartstop/

# Copyright
copyright: Copyright &copy; 2026 Bedirhan Yenilmez &ndash; Licensed under GPL-3.0

# Configuration
theme:
  name: material
  language: en
  custom_dir: overrides
  features:
    # - content.action.edit
    # - content.action.view
    # - content.code.annotate
    - content.code.copy
    # - content.code.select
    # - content.footnote.tooltips
    # - content.tabs.link
    - content.tooltips
    # - header.autohide
    # - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.path
    # - navigation.prune
    # - navigation.sections
    # - navigation.tabs
    # - navigation.tabs.sticky
    - navigation.top
    # - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    # - toc.integrate
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/favicon.png
  logo: assets/logo.png
  icon:
    repo: fontawesome/brands/github
    previous: fontawesome/solid/angle-left
    next: fontawesome/solid/angle-right

# Plugins
plugins:
  - group:
      enabled: !ENV [CI, false]
      plugins:
        - social
        - optimize
        - privacy
        - offline
        - minify:
            minify_html: true
        - llmstxt:
            markdown_description: |
              AutoStartStop is a Velocity proxy plugin that automates Minecraft server management through a YAML-based, rule-driven configuration system. You define rules composed of triggers (player connections, cron schedules, proxy lifecycle, pings, empty server detection etc.), optional conditions (server status, player counts, comparisons etc.), and actions (start/stop/restart servers, connect/disconnect players, send messages, manage bossbars, customize ping responses, execute shell commands etc.). It supports multiple server control APIs (Shell commands, AMP API, Pterodactyl Panel API etc.). Built-in templates provide ready-to-use patterns for common scenarios like auto-start on connect, auto-stop when idle, and custom MOTD responses etc. All configuration lives in a single config.yml file with dynamic variable support.
            full_output: llms-full.txt
            sections:
              Overview:
                - index.md: Plugin overview, key features, and example use cases
              Getting Started:
                - getting-started/index.md: Quick start guide for first-time setup
                - getting-started/installation.md: Download and installation instructions
                - getting-started/basic-concepts.md: Core concepts — rules, triggers, conditions, actions, servers, and templates
              Commands:
                - commands.md: Available plugin commands and permissions
              Configuration:
                - configuration/index.md: Configuration file structure and reloading
                - configuration/settings.md: Global plugin settings (timeouts, intervals, etc.)
                - configuration/defaults.md: Default values merged into all server configurations
                - configuration/servers.md: Server definitions, control API, ping, and startup timer settings
                - configuration/rules.md: Rule structure — triggers, conditions, actions, and templates
              Control API:
                - control-api/index.md: Overview of server control methods
                - control-api/shell.md: Shell command control API configuration
                - control-api/amp.md: AMP panel control API configuration
                - control-api/pterodactyl.md: Pterodactyl panel control API configuration
              Variables:
                - variables.md: Variable syntax, context variables, global server variables, and nested resolution
              Triggers:
                - triggers/index.md: Overview of all trigger types
                - triggers/proxy-start.md: Fires when the Velocity proxy starts
                - triggers/proxy-shutdown.md: Fires when the Velocity proxy shuts down
                - triggers/connection.md: Fires when a player connects to a server
                - triggers/empty-server.md: Fires when a server has been empty for a duration
                - triggers/cron.md: Fires on a cron schedule
                - triggers/ping.md: Fires when a client pings the proxy (server list/MOTD)
                - triggers/manual.md: Fires via the /autostartstop trigger command
              Conditions:
                - conditions/index.md: Overview of all condition types and evaluation modes
                - conditions/server-status.md: Check if a server is online or offline
                - conditions/player-count.md: Check the player count on a server
                - conditions/string-equals.md: Compare two string values
                - conditions/number-compare.md: Compare two numeric values
              Actions:
                - actions/index.md: Overview of all action types
                - actions/server-management/start.md: Start a server
                - actions/server-management/stop.md: Stop a server
                - actions/server-management/restart.md: Restart a server
                - actions/server-management/send-command.md: Send a command to a server console
                - actions/player-management/connect.md: Connect a player to a server
                - actions/player-management/disconnect.md: Disconnect players from the proxy
                - actions/player-management/allow-connection.md: Allow a previously denied connection
                - actions/player-communication/send-message.md: Send a chat message to players
                - actions/player-communication/send-action-bar.md: Send an action bar message to players
                - actions/player-communication/send-title.md: Send a title and subtitle to players
                - actions/player-communication/clear-title.md: Clear a player's title
                - actions/player-communication/show-bossbar.md: Show a bossbar to players
                - actions/player-communication/hide-bossbar.md: Hide a bossbar from players
                - actions/ping-management/deny-ping.md: Deny a ping request
                - actions/ping-management/allow-ping.md: Allow a ping request to proceed normally
                - actions/ping-management/respond-ping.md: Respond to a ping with a custom MOTD
                - actions/control-flow/if.md: Conditional action execution
                - actions/control-flow/while.md: Loop while a condition is true
                - actions/utility/sleep.md: Wait for a duration before continuing
                - actions/utility/log.md: Log a message to the console
                - actions/utility/exec.md: Execute a shell command
              Templates:
                - rule-templates/index.md: Overview of built-in rule templates
                - rule-templates/start-on-proxy-start.md: Template to start servers when the proxy starts
                - rule-templates/stop-on-proxy-shutdown.md: Template to stop servers when the proxy shuts down
                - rule-templates/start-on-connection.md: Template to start a server when a player connects
                - rule-templates/stop-on-empty.md: Template to stop servers after being empty for a duration
                - rule-templates/respond-ping.md: Template to customize ping/MOTD responses
              Examples:
                - examples/index.md: Overview of example configurations
                - examples/auto-start-stop-with-custom-ping-response.md: Auto start/stop with custom MOTD based on server status
                - examples/scheduled-restart-with-proxy-start.md: Auto start on proxy startup and scheduled restarts via cron
                - examples/hourly-random-reward.md: Scheduled command execution to reward random players
              Guides:
                - guides/index.md: Overview of available guides
                - guides/amp-user-setup.md: How to set up an AMP user for the control API
              Credits:
                - credits.md: License, third-party libraries, and documentation tools
  - search
  - include-markdown:
      rewrite_relative_urls: true

# Additional configuration
extra:
